<link rel="stylesheet" href="{{ "syntax.css" | relURL }}">
<style>
/* Ensure code blocks have dark background */
.highlight,
.chroma,
pre.chroma {
  background-color: #272822 !important;
  color: #f8f8f2 !important;
  padding: 1rem;
  border-radius: 4px;
  overflow-x: auto;
}

.highlight pre {
  background-color: transparent;
  margin: 0;
  padding: 0;
}

/* Ensure inline code also has proper styling with dark gray background */
/* More specific selector to override theme styles */
.markdown code,
code {
  background-color: #3a3a3a !important;
  color: #f8f8f2 !important;
  padding: 0.2em 0.4em;
  border-radius: 3px;
  font-family: monospace;
}

/* But not for code inside pre (already styled) */
pre code,
.markdown pre code {
  background-color: transparent !important;
  padding: 0;
}

/* Cuadro de aviso/advertencia ("ejercicio no revisado") tal y como en MediaWiki */
.aviso-cuadro,
.aviso-revisar,
.aviso-advertencia {
  background: #ffeae1;
  border: 1px solid #ffaaaa;
  border-radius: 4px;
  padding: 10px 14px;
  margin: 1.2rem 0;
  display: flex;
  align-items: center;
  gap: 15px;
  box-sizing: border-box;
}

.aviso-cuadro .aviso-icono,
.aviso-revisar .aviso-icono,
.aviso-advertencia .aviso-icono {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

.aviso-cuadro .aviso-icono img,
.aviso-revisar .aviso-icono img,
.aviso-advertencia .aviso-icono img {
  width: 80px;
  height: 40px;
  max-width: none;
  object-fit: contain;
  border: 0;
  display: block;
  margin: 0;
}

.aviso-cuadro .aviso-contenido,
.aviso-revisar .aviso-contenido,
.aviso-advertencia .aviso-contenido {
  flex: 1;
  font-size: 0.95rem;
  line-height: 1.45;
  color: #222222;
}

.aviso-cuadro .aviso-contenido p,
.aviso-revisar .aviso-contenido p,
.aviso-advertencia .aviso-contenido p {
  margin: 0;
  color: #222222;
}

.aviso-cuadro .aviso-contenido p + p,
.aviso-revisar .aviso-contenido p + p,
.aviso-advertencia .aviso-contenido p + p {
  margin-top: 4px;
}

.aviso-cuadro .aviso-contenido strong,
.aviso-revisar .aviso-contenido strong,
.aviso-advertencia .aviso-contenido strong {
  color: #111111;
  font-weight: 700;
}

@media (prefers-color-scheme: dark) {
  .aviso-cuadro,
  .aviso-revisar,
  .aviso-advertencia {
    background: #361b1b;
    border-color: #8c3a3a;
  }
  .aviso-cuadro .aviso-contenido,
  .aviso-revisar .aviso-contenido,
  .aviso-advertencia .aviso-contenido,
  .aviso-cuadro .aviso-contenido p,
  .aviso-revisar .aviso-contenido p,
  .aviso-advertencia .aviso-contenido p {
    color: #f7d7d7;
  }
  .aviso-cuadro .aviso-contenido strong,
  .aviso-revisar .aviso-contenido strong,
  .aviso-advertencia .aviso-contenido strong {
    color: #ffffff;
  }
}
</style>
