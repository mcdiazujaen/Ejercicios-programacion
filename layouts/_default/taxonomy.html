{{ define "main" }}
<article class="markdown book-post">
  <h1>{{ .Title }}</h1>
  
  {{ .Content }}
  
  <h2>Todos los ejercicios de {{ .Title }}</h2>
  
  {{ if .Pages }}
  <ul>
    {{ range .Pages.ByTitle }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="taxonomy-count">({{ len .Pages }} ejercicios)</span>
      </li>
    {{ end }}
  </ul>
  {{ else }}
    <p>No hay términos disponibles.</p>
  {{ end }}
</article>
{{ end }}
