baseURL = "https://mcdiazujaen.github.io/Ejercicios-programacion/"
defaultContentLanguage = "es"
locale = "es-es"
title = "Ejercicios de Programación"
theme = "hugo-book"

[params]
  description = "Ejercicios de programación en diferentes lenguajes"
  author = "Manuel C. Díaz Galiano"
  
  # Hugo-Book theme parameters
  BookTheme = 'auto'
  BookToC = true
  BookSearch = true
  BookSection = 'ejercicios'
  BookComments = false

[taxonomies]
  tag = "tags"
  language = "languages"
  professor = "professors"
  category = "categories"

[menu]
  [[menu.before]]
    name = "Inicio"
    pageRef = "/"
    weight = 1
  
  [[menu.before]]
    name = "Lenguajes"
    pageRef = "/languages"
    weight = 2
  
  [[menu.before]]
    name = "Categorías"
    pageRef = "/categories"
    weight = 3
  
  [[menu.before]]
    name = "Profesores"
    pageRef = "/professors"
    weight = 4
  
  [[menu.before]]
    name = "Tags"
    pageRef = "/tags"
    weight = 5

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
