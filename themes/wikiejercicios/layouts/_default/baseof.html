<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/chroma.css">
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        header h1 {
            margin-bottom: 10px;
            color: white;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        main {
            min-height: 60vh;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #777;
        }

        .tags {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.9em;
        }

        .tag:hover {
            background: #2980b9;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }

        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
        }

        pre code {
            background: none;
            padding: 0;
        }

        h1,
        h2,
        h3 {
            margin-top: 25px;
            margin-bottom: 15px;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        h3 {
            color: #7f8c8d;
        }

        img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
        }

        .exercise-list {
            list-style: none;
        }

        .exercise-list li {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 3px;
        }

        .exercise-list a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1em;
        }

        .exercise-list a:hover {
            color: #3498db;
        }
    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="/icono.png" alt="WikiEjercicios Logo" style="height: 50px; width: auto;">
            <h1>{{ .Site.Title }}</h1>
        </div>
        <nav>
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
        </nav>
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer>
        <p>&copy; {{ now.Year }} WikiEjercicios - Ejercicios de Programación</p>
    </footer>
</body>

</html>
